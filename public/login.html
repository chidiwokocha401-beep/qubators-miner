<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Qubators Cloud Miner — Login</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <main class="wrap" id="main-content" tabindex="-1">
    <div class="auth-box">
      <h1>Qubators Cloud Miner</h1>
      <form class="card" aria-labelledby="formTitle" onsubmit="event.preventDefault(); handleSubmit()">
        <h2 id="formTitle">Sign In</h2>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com" value="">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Your password" value="">
        </div>
        <div class="field" id="nameField" style="display:none">
          <label for="displayName">Display Name</label>
          <input id="displayName" name="displayName" type="text" autocomplete="nickname" disabled placeholder="How should we call you?" value="">
        </div>
        <div id="authError" role="alert" aria-atomic="true"></div>
        <button class="action" id="submitBtn" type="submit">Sign In</button>
        <div class="alt">
          <span id="altText">Don't have an account?</span>
          <button class="text-button" type="button" id="toggleMode" aria-controls="nameField" aria-expanded="false">Sign up</button>
        </div>
      </form>
    </div>
  </main>

  <script src="/js/app.js"></script>
  <script>
    let mode = 'signin';

    function toggleMode() {
      mode = mode === 'signin' ? 'signup' : 'signin';
      document.getElementById('formTitle').textContent = mode === 'signin' ? 'Sign In' : 'Sign Up';
      document.getElementById('nameField').style.display = mode === 'signup' ? 'block' : 'none';
      document.getElementById('displayName').disabled = mode !== 'signup';
      document.getElementById('displayName').required = mode === 'signup';
      document.getElementById('password').autocomplete = mode === 'signup' ? 'new-password' : 'current-password';
      document.getElementById('toggleMode').setAttribute('aria-expanded', String(mode === 'signup'));
      document.getElementById('submitBtn').textContent = mode === 'signin' ? 'Sign In' : 'Sign Up';
      document.getElementById('altText').textContent = mode === 'signin' ? "Don't have an account?" : 'Already have an account?';
      document.getElementById('toggleMode').textContent = mode === 'signin' ? 'Sign up' : 'Sign in';
      document.getElementById('authError').innerHTML = '';
    }

    document.getElementById('toggleMode').addEventListener('click', toggleMode);

    async function handleSubmit() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const displayName = document.getElementById('displayName').value.trim();
      const errBox = document.getElementById('authError');
      errBox.innerHTML = '';

      if (!email || !password) {
        errBox.innerHTML = '<div class="error-box">Please fill in all fields.</div>';
        return;
      }

      try {
        if (mode === 'signin') {
          await signIn(email, password);
        } else {
          if (!displayName) {
            errBox.innerHTML = '<div class="error-box">Please enter a display name.</div>';
            return;
          }
          await signUp(email, password, displayName);
        }
        window.location.href = '/index.html';
      } catch (e) {
        showError('authError', e.message);
      }
    }

    // Redirect if already logged in
    if (authToken) {
      checkAuth().then(ok => {
        if (ok) window.location.href = '/index.html';
      });
    }
  </script>
</body>
</html>
