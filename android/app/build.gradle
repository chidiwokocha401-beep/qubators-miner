plugins {
    id 'com.android.application'
}

android {
    namespace 'com.qubators.miner'
    compileSdk 34

    defaultConfig {
        applicationId 'com.qubators.miner'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {}
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
